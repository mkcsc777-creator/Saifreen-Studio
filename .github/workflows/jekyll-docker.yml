<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111827"><title>PhotoCloud — Studio Manager</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<section id="configScreen" class="auth-wrap hidden"><div class="auth-card"><div class="logo">📸 PhotoCloud</div><h1>Connect your cloud</h1><p class="muted">Supabase Project URL और Publishable/anon key डालें। ये जानकारी आपके Supabase Dashboard में मिलती है।</p><form id="configForm" class="stack"><label>Supabase Project URL<input id="projectUrl" type="url" placeholder="https://xxxx.supabase.co" required></label><label>Publishable / anon key<textarea id="anonKey" rows="3" placeholder="sb_publishable_... या पुरानी anon key" required></textarea></label><button class="primary" type="submit">Connect</button></form><p class="tiny">यह key ब्राउज़र में इस्तेमाल के लिए होती है। Secret या service_role key यहाँ न डालें।</p><div id="configMessage" class="message"></div></div></section>
<section id="authScreen" class="auth-wrap hidden"><div class="auth-card"><div class="logo">📸 PhotoCloud</div><h1>Studio Login</h1><p class="muted">अपने स्टूडियो के ग्राहक और बुकिंग सुरक्षित रूप से मैनेज करें।</p>
<div class="tabs"><button type="button" class="tab active" data-auth="email">Email</button><button type="button" class="tab" data-auth="phone">Mobile OTP</button></div>
<form id="emailAuthForm" class="stack"><label>Email<input id="authEmail" type="email" autocomplete="username" placeholder="you@example.com" required></label><label>Password<input id="authPassword" type="password" autocomplete="current-password" minlength="6" placeholder="कम से कम 6 अक्षर" required></label><div class="button-row"><button class="primary" type="submit" id="emailLoginBtn">Login</button><button class="secondary" type="button" id="emailSignupBtn">Create account</button></div></form>
<form id="phoneAuthForm" class="stack hidden"><label>Mobile number (country code सहित)<input id="authPhone" type="tel" placeholder="+919876543210" required></label><button class="primary" type="submit" id="sendOtpBtn">OTP भेजें</button><label id="otpLabel" class="hidden">OTP<input id="authOtp" inputmode="numeric" autocomplete="one-time-code" placeholder="SMS में आया OTP"></label><button id="verifyOtpBtn" type="button" class="secondary hidden">OTP Verify करें</button><p class="tiny">Mobile OTP के लिए Supabase में Phone Auth और SMS provider चालू होना चाहिए।</p></form><button id="changeConfigBtn" type="button" class="linkbtn">Change Supabase connection</button><div id="authMessage" class="message" role="status"></div></div></section>
<section id="setupScreen" class="auth-wrap hidden"><div class="auth-card"><div class="logo">📸 PhotoCloud</div><h1 id="setupTitle">Studio सेटअप</h1><p class="muted" id="setupDescription">पहले स्टूडियो का नाम डालें।</p><form id="createStudioForm" class="stack"><label>Studio / Business Name<input id="studioName" required placeholder="जैसे Raja Photo Studio"></label><button class="primary" type="submit">Create Studio (Owner)</button></form><div class="or">या स्टाफ के रूप में जुड़ें</div><form id="joinStudioForm" class="stack"><label>Owner का Staff Join Code<input id="joinCode" required placeholder="Owner से मिला code"></label><button class="secondary" type="submit">Join Studio (Staff)</button></form><button id="setupLogout" class="linkbtn">Logout</button><div id="setupMessage" class="message"></div></div></section>
<div id="appShell" class="app hidden"><aside class="sidebar"><div class="brand">📸 <span>PhotoCloud</span></div><div class="studio-chip" id="studioBadge">Studio</div><button class="nav active" data-page="dashboard">🏠 Dashboard</button><button class="nav" data-page="customers">👤 Customers</button><button class="nav" data-page="booking">📅 New Booking</button><button class="nav" data-page="bookings">📋 Bookings</button><div class="sidebar-bottom"><span id="userRole" class="role-pill">Member</span><button id="logoutBtn" class="nav">↪ Logout</button></div></aside>
<main class="main"><header class="topbar"><div><h1 id="pageTitle">Dashboard</h1><p>Photography & Videography Customer Management</p></div><button class="primary" onclick="showPage('booking')">+ New Booking</button></header>
<section id="dashboard" class="page active"><div class="cards"><div class="card"><span>👥</span><small>Total Customers</small><strong id="customerCount">0</strong></div><div class="card"><span>📅</span><small>Total Bookings</small><strong id="bookingCount">0</strong></div><div class="card"><span>💰</span><small>Advance Received</small><strong id="advanceTotal">₹0</strong></div><div class="card"><span>⏳</span><small>Pending Amount</small><strong id="pendingTotal">₹0</strong></div></div><div class="panel"><div class="panel-head"><h2>Upcoming Bookings</h2><button class="linkbtn" onclick="showPage('bookings')">View All</button></div><div id="upcoming"></div></div><div class="panel" id="staffPanel"><div class="panel-head"><h2>Staff Access</h2></div><p class="muted">यह join code केवल अपने भरोसेमंद स्टाफ को दें। कोड पाने वाला लॉगिन किया हुआ व्यक्ति इस स्टूडियो से जुड़ सकता है।</p><div class="code-row"><code id="inviteCode">—</code><button class="secondary" id="copyCodeBtn">Copy join code</button><button class="secondary" id="refreshCodeBtn">New code</button></div><p class="tiny">नया कोड बनाने पर पुराना कोड बंद हो जाएगा।</p></div></section>
<section id="customers" class="page"><div class="panel"><div class="panel-head"><h2>Add Customer</h2></div><form id="customerForm" class="grid"><input id="cName" required placeholder="Customer Name"><input id="cPhone" required placeholder="Mobile Number"><input id="cAddress" placeholder="Address"><input id="cWhatsapp" placeholder="WhatsApp Number"><button class="primary" type="submit">Save Customer</button></form></div><div class="panel"><h2>Customer List</h2><input id="customerSearch" class="search" placeholder="नाम या मोबाइल से खोजें"><div id="customerList"></div></div></section>
<section id="booking" class="page"><div class="panel"><div class="panel-head"><h2>New Booking</h2></div><form id="bookingForm" class="grid"><select id="bCustomer" required><option value="">Select Customer</option></select><input id="bDate" type="date" required><select id="bType" required><option value="">Event Type</option><option>Wedding</option><option>Engagement</option><option>Birthday</option><option>Pre-Wedding</option><option>Rice Ceremony</option><option>Other</option></select><input id="bPackage" placeholder="Package / Service"><input id="bTotal" type="number" min="0" step="0.01" placeholder="Total Amount ₹" required><input id="bAdvance" type="number" min="0" step="0.01" placeholder="Advance ₹" required><input id="bNote" class="full" placeholder="Special Note"><button class="primary" type="submit">Save Booking</button></form></div></section>
<section id="bookings" class="page"><div class="panel"><div class="panel-head"><h2>All Bookings</h2></div><input id="bookingSearch" class="search" placeholder="Customer, event या date से खोजें"><div id="bookingList"></div></div></section>
</main></div><div id="toast" class="toast" aria-live="polite"></div><script src="script.js"></script></body></html>
